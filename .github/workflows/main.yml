name: CI/CD Pipeline (Docker)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание кода
        uses: actions/checkout@v3

      - name: Авторизация в Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Проверка сборки и отправка Docker-образа
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/backend/Dockerfile
          # Отправляем в Docker Hub только если это не просто PR, а вливание в main
          push: ${{ github.event_name == 'push' }}
          tags: ${{ secrets.DOCKER_USERNAME }}/trailsua-api:latest

  deploy:
    needs: build
    # Деплой на сервер запускается ТОЛЬКО при слиянии в ветку main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Деплой на сервер через SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/trailsua-api:latest
            docker stop trailsua-api || true
            docker rm trailsua-api || true
            docker run -d --name trailsua-api --restart unless-stopped -p 80:8080 ${{ secrets.DOCKER_USERNAME }}/trailsua-api:latest
