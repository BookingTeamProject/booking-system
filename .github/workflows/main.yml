name: CI/CD Pipeline (Docker)

on:
  push:
    branches: [ "main", "backend" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание кода
        uses: actions/checkout@v3

      - name: Авторизация в Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Сборка и отправка Docker-образа
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/trailsua-api:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Деплой на сервер через SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Скачиваем свежий образ из Docker Hub
            docker pull ${{ secrets.DOCKER_USERNAME }}/trailsua-api:latest
            
            # 2. Останавливаем и удаляем старый контейнер (если он был)
            docker stop trailsua-api || true
            docker rm trailsua-api || true
            
            # 3. Запускаем новый контейнер
            docker run -d --name trailsua-api --restart unless-stopped -p 80:8080 ${{ secrets.DOCKER_USERNAME }}/trailsua-api:latest
