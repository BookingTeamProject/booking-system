name: CI/CD Pipeline (Docker)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Скачивание кода
      uses: actions/checkout@v3

    - name: Авторизация в Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Проверка сборки и отправка Docker-образа
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./docker/backend/Dockerfile
        push: ${{ github.event_name == 'push' }}
        tags: ${{ secrets.DOCKER_USERNAME }}/trailsua-api:latest

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Деплой на сервер через SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /home/ec2-user
          curl -o docker-compose.yml https://raw.githubusercontent.com/BookingTeamProject/booking-system/main/docker-compose.yml
          export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
          sudo -E docker compose pull
          sudo -E docker compose up -d --remove-orphans
