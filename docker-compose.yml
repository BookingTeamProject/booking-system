services:
  postgres:
    image: postgres:16-alpine
    container_name: trails_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: trails_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trails-net

  trailsua-api:
    image: kirll431/trailsua-api:latest
    container_name: trailsua-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=trails_postgres;Port=5432;Database=trails_db;Username=postgres;Password=${DB_PASSWORD}
    depends_on:
      - postgres
    networks:
      - trails-net

volumes:
  postgres_data:

networks:
  trails-net:
    driver: bridge
